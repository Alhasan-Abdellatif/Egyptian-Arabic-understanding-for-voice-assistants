# mlx-lm LoRA SFT on Apple silicon. `model`, `data`, `adapter_path` are set per run by the Makefile:
#   uv run python -m mlx_lm lora -c configs/mlx_lora.yaml --model ... --data data/sft/D --adapter-path adapters/...
# C and D train for the same number of steps, so both see the same number of examples
# (C repeats MASSIVE ~1.7x; D covers MASSIVE + Egyptian ~1.1x).
train: true
fine_tune_type: lora
mask_prompt: true          # loss on the assistant JSON only
num_layers: -1             # LoRA on every transformer block
# mlx-lm applies `scale` directly (y + scale * BAx) and its trainer has NO gradient clipping,
# so scale 20.0 (its default, meant for rank 8 + lr 1e-5) with lr 2e-4 blew both runs up.
# scale 2.0 = alpha 32 / rank 16, matching the TRL config used on the GPU track.
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
# Qwen3.5 has a 248k vocabulary, so logits for a 16-example batch overflow the 16GB Mac's
# ~12.7GB GPU budget. Micro-batch 4 x 4 accumulation keeps the effective batch at 16.
batch_size: 4
grad_accumulation_steps: 4
iters: 4800                # micro-batches = 1200 optimizer updates x 16 examples (~1 epoch of D)
learning_rate: 1.0e-4
lr_schedule:               # counted in optimizer updates
  name: cosine_decay
  warmup: 100
  arguments: [1.0e-4, 1200, 1.0e-6]
max_seq_length: 256
grad_checkpoint: false     # Qwen3-0.6B peaks at 4.3GB without it and trains ~25% faster
steps_per_report: 100
steps_per_eval: 800
val_batches: -1            # evaluate on the whole (small) valid set
save_every: 800
seed: 0
