[project]
name = "lahja"
version = "0.1.0"
description = "Egyptian-Arabic voice-assistant NLU: intent + slot tool calling with small LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Training / inference extras, installed per machine (Colab GPU vs. Apple Silicon).
gpu = ["torch>=2.4", "transformers>=4.50", "peft>=0.14", "trl>=0.16", "datasets>=3.0", "accelerate>=1.0"]
mlx = ["mlx-lm>=0.22"]
annotate = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lahja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is left to `ruff format`
